<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rahul Kumar Rana — Java Backend &amp; Web Developer</title>
<meta name="description" content="Portfolio of Rahul Kumar Rana, Java Backend and Web Developer.">
<link rel="stylesheet" href="./Protfolio.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13.5A9 9 0 1110.5 3a7 7 0 0010.5 10.5z"/></symbol>
  <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></symbol>
  <symbol id="i-medal" viewBox="0 0 24 24"><circle cx="12" cy="15" r="5"/><path d="M8.5 11L6 3h4l2 4 2-4h4l-2.5 8"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-rupee" viewBox="0 0 24 24"><path d="M6 4h12M6 9h12M6 4c6 0 8 2 8 5s-3 5-8 5l8 7"/></symbol>
  <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></symbol>
</svg>

<canvas id="net" aria-hidden="true"></canvas>
<div class="glow g1"></div><div class="glow g2"></div><div class="spot" id="spot"></div>

<header class="topbar">
  <div class="brand">
    <button class="avatar-btn" id="avatarBtn" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="menu.open">
      <span class="photo">RR<img src="photo.jpg" alt="" class="ph"></span>
    </button>
    <a class="brand-name" href="#home" data-go="home" data-i18n-aria="nav.home">Rahul Kumar Rana</a>
  </div>
  <div class="tools">
    <div class="lang" id="lang">
      <button class="tool-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
        <span id="langLabel">EN</span>
        <svg class="caret" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 3.5l3 3 3-3"/></svg>
      </button>
      <ul class="lang-list" role="listbox" id="langList">
        <li><button role="option" data-lang="en">English <span>EN</span></button></li>
        <li><button role="option" data-lang="hi">हिन्दी <span>HI</span></button></li>
        <li><button role="option" data-lang="bn">বাংলা <span>BN</span></button></li>
      </ul>
    </div>
    <button class="tool-btn theme-btn" id="themeBtn" aria-label="Toggle theme">
      <svg class="i sun"><use href="#i-sun"/></svg><svg class="i moon"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- HOME -->
  <section class="view" id="view-home" data-view="home">
    <div class="hero">
      <div>
        <span class="eyebrow" data-i18n="hero.eyebrow"></span>
        <h1><span data-i18n="hero.hi"></span> <span class="name grad">Rahul Kumar Rana</span></h1>
        <p class="hero-sub" data-i18n="hero.sub"></p>
        <div class="typing" id="typing" aria-live="off"></div>
        <div class="cta">
          <button class="btn primary" data-go="projects"><span data-i18n="hero.cta1"></span><svg class="i"><use href="#i-arrow"/></svg></button>
          <button class="btn" data-go="contact"><span data-i18n="hero.cta2"></span><svg class="i"><use href="#i-arrow"/></svg></button>
        </div>
      </div>
      <div class="photo-wrap">
        <button class="photo-btn" id="heroPhoto" data-devo="hero" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="menu.open">
          <span class="photo">RR<img src="photo.jpg" alt="Rahul Kumar Rana" class="ph"></span>
        </button>
        <span class="hint" data-i18n="hero.tap"></span>
      </div>
    </div>

    <div class="card tech-card reveal" data-devo="tech">
      <h2 class="block-title" data-i18n="tech.title"></h2>
      <p class="block-sub" data-i18n="tech.sub"></p>
      <div class="tech-grid" id="techGrid"></div>
    </div>

    <div class="teasers">
      <button class="card teaser reveal" data-go="about" data-devo="t-about">
        <span class="ico"><svg class="i"><use href="#i-user"/></svg></span>
        <h3 data-i18n="nav.about"></h3><p data-i18n="home.about"></p>
        <span class="open"><span data-i18n="home.open"></span><svg class="i"><use href="#i-arrow"/></svg></span>
      </button>
      <button class="card teaser reveal" data-go="skills" data-devo="t-skills">
        <span class="ico"><svg class="i"><use href="#i-code"/></svg></span>
        <h3 data-i18n="nav.skills"></h3><p data-i18n="home.skills"></p>
        <span class="open"><span data-i18n="home.open"></span><svg class="i"><use href="#i-arrow"/></svg></span>
      </button>
      <button class="card teaser reveal" data-go="projects" data-devo="t-projects">
        <span class="ico"><svg class="i"><use href="#i-folder"/></svg></span>
        <h3 data-i18n="nav.projects"></h3><p data-i18n="home.projects"></p>
        <span class="open"><span data-i18n="home.open"></span><svg class="i"><use href="#i-arrow"/></svg></span>
      </button>
      <button class="card teaser reveal" data-go="contact" data-devo="t-contact">
        <span class="ico"><svg class="i"><use href="#i-mail"/></svg></span>
        <h3 data-i18n="nav.contact"></h3><p data-i18n="home.contact"></p>
        <span class="open"><span data-i18n="home.open"></span><svg class="i"><use href="#i-arrow"/></svg></span>
      </button>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="view" id="view-about" data-view="about">
    <h1 class="page-h" data-i18n-html="about.h"></h1>
    <p class="page-sub" data-i18n="about.sub"></p>
    <div class="about-grid">
      <div class="card reveal" data-devo="a-bio">
        <p data-i18n="about.p1"></p><p data-i18n="about.p2"></p><p data-i18n="about.p3"></p>
      </div>
      <div class="card facts reveal">
        <div class="fact"><small data-i18n="fact.role"></small><b data-i18n="fact.roleV"></b></div>
        <div class="fact"><small data-i18n="fact.edu"></small><b data-i18n="fact.eduV"></b></div>
        <div class="fact"><small data-i18n="fact.open"></small><b data-i18n="fact.openV"></b></div>
      </div>
    </div>
    <div class="focus" data-devo="a-focus">
      <div class="card reveal"><span class="ico"><svg class="i"><use href="#i-code"/></svg></span><h3 data-i18n="focus1.t"></h3><p data-i18n="focus1.d"></p></div>
      <div class="card reveal"><span class="ico"><svg class="i"><use href="#i-grid"/></svg></span><h3 data-i18n="focus2.t"></h3><p data-i18n="focus2.d"></p></div>
      <div class="card reveal"><span class="ico"><svg class="i"><use href="#i-medal"/></svg></span><h3 data-i18n="focus3.t"></h3><p data-i18n="focus3.d"></p></div>
    </div>
    <div class="stats" data-devo="a-stats">
      <div class="card stat reveal"><b class="grad">160</b><span data-i18n="stat1"></span></div>
      <div class="card stat reveal"><b class="grad">5</b><span data-i18n="stat2"></span></div>
      <div class="card stat reveal"><b class="grad">6</b><span data-i18n="stat3"></span></div>
    </div>
  </section>

  <!-- SKILLS -->
  <section class="view" id="view-skills" data-view="skills">
    <h1 class="page-h" data-i18n-html="skills.h"></h1>
    <p class="page-sub" data-i18n="skills.sub"></p>
    <div class="bento">
      <div class="card reveal" data-devo="s-skills">
        <div class="card-head"><span class="ico"><svg class="i"><use href="#i-code"/></svg></span><div><h2 data-i18n="skills.card"></h2><p data-i18n="skills.cardSub"></p></div></div>
        <div id="skillGroups"></div>
      </div>
      <div class="stack">
        <div class="card reveal" data-devo="s-edu">
          <div class="card-head"><span class="ico"><svg class="i"><use href="#i-cap"/></svg></span><div><h2 data-i18n="edu.title"></h2><p data-i18n="edu.sub"></p></div></div>
          <ul class="timeline">
            <li><b data-i18n="edu1.t"></b><span data-i18n="edu1.s"></span><span data-i18n="edu1.d"></span></li>
            <li><b data-i18n="edu2.t"></b><span data-i18n="edu2.d"></span></li>
          </ul>
        </div>
        <div class="card reveal" data-devo="s-cert">
          <div class="card-head"><span class="ico"><svg class="i"><use href="#i-medal"/></svg></span><div><h2 data-i18n="cert.title"></h2></div></div>
          <ul class="certs">
            <li><b data-i18n="cert1.t"></b><span data-i18n="cert1.d"></span><div class="cert-link" data-cert="dsa"></div></li>
            <li><b data-i18n="cert2.t"></b><span data-i18n="cert2.d"></span><div class="cert-link" data-cert="oracle"></div></li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section class="view" id="view-projects" data-view="projects">
    <h1 class="page-h" data-i18n-html="proj.h"></h1>
    <p class="page-sub" data-i18n="proj.sub"></p>
    <div class="filters" data-devo="p-filters">
      <button class="chip" data-filter="all" aria-pressed="true" data-i18n="f.all"></button>
      <button class="chip" data-filter="frontend" aria-pressed="false" data-i18n="f.frontend"></button>
      <button class="chip" data-filter="backend" aria-pressed="false" data-i18n="f.backend"></button>
      <button class="chip" data-filter="fullstack" aria-pressed="false" data-i18n="f.full"></button>
      <span class="count" id="projCount"></span>
    </div>
    <div class="proj-grid" id="projGrid" data-devo="p-grid">
      <article class="card proj reveal" data-cat="backend">
        <div class="art"><svg class="i"><use href="#i-code"/></svg></div>
        <span class="tag" data-i18n="tag.backend"></span><h3 data-i18n="p1.t"></h3><p data-i18n="p1.d"></p>
        <div class="pills"><span class="pill">Spring Boot</span><span class="pill">Hibernate</span><span class="pill">MySQL</span><span class="pill">JWT</span><span class="pill">Docker</span></div>
        <div class="proj-links" data-proj="p1"></div>
      </article>
      <article class="card proj reveal" data-cat="frontend">
        <div class="art"><svg class="i"><use href="#i-grid"/></svg></div>
        <span class="tag" data-i18n="tag.frontend"></span><h3 data-i18n="p2.t"></h3><p data-i18n="p2.d"></p>
        <div class="pills"><span class="pill">JavaScript</span><span class="pill">HTML</span><span class="pill">CSS</span></div>
        <div class="proj-links" data-proj="p2"></div>
      </article>
      <article class="card proj reveal" data-cat="fullstack">
        <div class="art"><svg class="i"><use href="#i-rupee"/></svg></div>
        <span class="tag" data-i18n="tag.full"></span><h3 data-i18n="p3.t"></h3><p data-i18n="p3.d"></p>
        <div class="pills"><span class="pill">Android</span><span class="pill">Multi-table DB</span><span class="pill">Validation</span></div>
        <div class="proj-links" data-proj="p3"></div>
      </article>
      <article class="card proj reveal" data-cat="fullstack">
        <div class="art"><svg class="i"><use href="#i-folder"/></svg></div>
        <span class="tag" data-i18n="tag.mobile"></span><h3 data-i18n="p4.t"></h3><p data-i18n="p4.d"></p>
        <div class="pills"><span class="pill">Spring Boot</span><span class="pill">React Native</span><span class="pill">MySQL</span><span class="pill">JWT</span><span class="pill">Docker</span><span class="pill">BCrypt</span></div>
        <div class="proj-links" data-proj="p4"></div>
      </article>
      <article class="card proj reveal" data-cat="fullstack">
        <div class="art"><svg class="i"><use href="#i-code"/></svg></div>
        <span class="tag" data-i18n="tag.full"></span><h3 data-i18n="p5.t"></h3><p data-i18n="p5.d"></p>
        <div class="pills"><span class="pill">Java</span><span class="pill">HTML5</span><span class="pill">CSS3</span><span class="pill">JavaScript</span><span class="pill">Docker</span><span class="pill">Render</span><span class="pill">GitHub Pages</span></div>
        <div class="proj-links" data-proj="p5"></div>
      </article>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="view" id="view-contact" data-view="contact">
    <div class="card contact-card reveal">
      <div data-devo="c-links">
        <span class="eyebrow" data-i18n="c.eyebrow"></span>
        <h2 data-i18n="c.h"></h2>
        <p data-i18n="c.p"></p>
        <div class="links" id="links"></div>
        <a class="btn primary" id="mailBtn"><span data-i18n="c.email"></span><svg class="i"><use href="#i-arrow"/></svg></a>
      </div>
      <form class="form" id="form" novalidate data-devo="c-form">
        <h3 data-i18n="form.title"></h3>
        <p class="lead" data-i18n="form.sub"></p>
        <label class="f"><span><span data-i18n="form.name"></span> <em>*</em></span><input name="name" autocomplete="name" required maxlength="80"></label>
        <div class="row2">
          <label class="f"><span><span data-i18n="form.phone"></span> <em>*</em></span><input name="phone" type="tel" autocomplete="tel" required maxlength="20" inputmode="tel"></label>
          <label class="f"><span data-i18n="form.alt"></span><input name="alt" type="tel" maxlength="20" inputmode="tel"></label>
        </div>
        <label class="f"><span data-i18n="form.email"></span><input name="email" type="email" autocomplete="email" maxlength="120"></label>
        <fieldset class="f"><legend><span data-i18n="form.reason"></span> <em>*</em></legend>
          <div class="reasons">
            <label><input type="radio" name="reason" value="Internship / Job" required><span data-i18n="r1"></span></label>
            <label><input type="radio" name="reason" value="Project collaboration"><span data-i18n="r2"></span></label>
            <label><input type="radio" name="reason" value="Freelance work"><span data-i18n="r3"></span></label>
            <label><input type="radio" name="reason" value="Feedback"><span data-i18n="r4"></span></label>
            <label><input type="radio" name="reason" value="Other"><span data-i18n="r5"></span></label>
          </div>
        </fieldset>
        <label class="f"><span data-i18n="form.note"></span><textarea name="note" maxlength="1500"></textarea></label>
        <input class="hp" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn primary" type="submit" id="sendBtn"><span id="sendLabel" data-i18n="form.send"></span><svg class="i"><use href="#i-send"/></svg></button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>
</main>

<footer data-i18n="foot"></footer>

<!-- section menu opened by profile photo -->
<div class="menu" id="menu" role="menu">
  <div class="menu-title" data-i18n="menu.title"></div>
  <button role="menuitem" data-go="home" style="--i:0"><span class="ico"><svg class="i"><use href="#i-home"/></svg></span><span data-i18n="nav.home"></span></button>
  <button role="menuitem" data-go="about" style="--i:1"><span class="ico"><svg class="i"><use href="#i-user"/></svg></span><span data-i18n="nav.about"></span></button>
  <button role="menuitem" data-go="skills" style="--i:2"><span class="ico"><svg class="i"><use href="#i-code"/></svg></span><span data-i18n="nav.skills"></span></button>
  <button role="menuitem" data-go="projects" style="--i:3"><span class="ico"><svg class="i"><use href="#i-folder"/></svg></span><span data-i18n="nav.projects"></span></button>
  <button role="menuitem" data-go="contact" style="--i:4"><span class="ico"><svg class="i"><use href="#i-mail"/></svg></span><span data-i18n="nav.contact"></span></button>
</div>

<!-- Devo: guide ball -->
<div id="devo" aria-live="polite">
  <div class="devo-fx"><div class="devo-float">
    <button class="devo-ball" id="devoBall" aria-label="Devo, portfolio guide"><span id="devoFace">😊</span></button>
  </div></div>
  <div class="devo-bubble up lft" id="devoBubble"><b>Devo</b><span id="devoText"></span><button class="devo-x" id="devoX" aria-label="Close">✕</button></div>
</div>

<script src="./Protfolio.js"></script>
</body>
</html>
